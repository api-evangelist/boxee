aid: boxee
name: Boxee
description: 'Boxee, Inc. was a New York and Tel Aviv based consumer media company founded in 2007 by
  Avner Ronen, Tom Sella, Idan Cohen, Gidon Coussin and Roy Vulcan. Its cross-platform media-center
  software began as a fork of the open-source XBMC project and bridged local media libraries with
  internet streaming sources. Boxee shipped a Python-based application API in April 2009 that let third
  parties build Boxee apps in Python with XML-defined interfaces, distributed through the Boxee app
  directory and documented at developer.boxee.tv. Hardware followed with the D-Link Boxee Box (2010)
  and Boxee TV with a cloud DVR service (2012). Backed by Union Square Ventures and Spark Capital,
  Boxee was acquired by Samsung Electronics in July 2013; the cloud DVR was shut down on 10 July 2013
  and Samsung wound down the Boxee team in 2015. The company is defunct and no API surface, developer
  portal, or documentation remains reachable.'
