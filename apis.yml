  the Njalla privacy registrar (expires 2028-01-24). The github.com/Boxee organization ("Boxee, Inc.",
  created 2011-03-01) is still live but publishes zero public repositories. No live API surface,
  specs, hosts, or /.well-known documents exist to enrich or probe; every enrichment artifact type was
